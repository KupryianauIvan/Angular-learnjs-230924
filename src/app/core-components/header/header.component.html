<mat-toolbar color="primary">
    <button
        mat-icon-button
        class="example-icon"
        aria-label="Example icon-button with menu icon"
        (click)="onClick($event)"
    >
        <!--
            (click)="onClick($event)"
              |
              V
            button.addEventListener('click', ($event) => {
              onClick($event);
            });
        -->

        <mat-icon>menu</mat-icon>
    </button>
    <img class="header-ico" [src]="applicationConfig?.shopIconSrc" alt="" />
    <!--    <img class="header-ico" [src]="(applicationConfig && applicationConfig.shopIconSrc)" alt="" />-->

    <!-- TODO Binding we use to pass the values -->
    <!-- Interpolation we use to show the executed value -->

    <!--  <img class="header-ico"-->
    <!--       [src]="imgSrc"-->
    <!--       [style.width.px]="100"-->
    <!--       alt=""-->
    <!--  />-->
    <span>{{ applicationConfig?.title }}</span>
    <span class="example-spacer"></span>
    <button
        mat-icon-button
        class="example-icon favorite-icon"
        aria-label="Example icon-button with heart icon"
    >
        <mat-icon>favorite</mat-icon>
    </button>
    <button
        mat-icon-button
        class="example-icon"
        aria-label="Example icon-button with share icon"
    >
        <mat-icon>share</mat-icon>
    </button>
</mat-toolbar>
