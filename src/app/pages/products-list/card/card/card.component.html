<mat-card class="example-card">
    <mat-card-header>
        <mat-card-title>{{ product?.name }}</mat-card-title>
        <mat-card-subtitle>{{ product?.subCategory }}</mat-card-subtitle>
        <mat-card-subtitle>The price is: {{ product?.price }}$</mat-card-subtitle>
    </mat-card-header>
    <img
        mat-card-image
        alt="Photo of a Shiba Inu"
        [src]="product?.images?.[0]?.url || product?.images?.[0]?.source"
    />
    <mat-card-actions class="example-card_actions">
        <button mat-raised-button color="primary" (click)="onBuyButtonClick($event)">Buy</button>
    </mat-card-actions>
    <div class="rating">
        <button *ngFor="let item of createArray(product?.rating)" mat-icon-button>
            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="star"></mat-icon>
        </button>
    </div>
</mat-card>
